spring.application.name=BikeRentalSystem

# All data files live in this folder. The path is relative to where the app is started,
# so start the app from the project folder, or override it: --data.dir=C:/full/path/to/data
data.dir=src/main/resources/data

user.file.path=${data.dir}/users.txt

spring.thymeleaf.cache=false
server.port=8081
