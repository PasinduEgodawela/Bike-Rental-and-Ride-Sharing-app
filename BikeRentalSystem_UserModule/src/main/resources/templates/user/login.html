<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RIDEX | Sign in</title>
    <style>
        :root{--bg:#0e0e10;--card:#161618;--line:#2a2a2d;--field:#0b0b0c;--tx:#f4f4f5;--mu:#9a9aa2;--red:#dc2626;--red2:#b91c1c;--red3:#ff4545;--am:#f5b82e;--gr:#34d399}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,"Segoe UI",system-ui,Arial,sans-serif}
        .pg,.container{max-width:1200px;margin:0 auto;padding:0 24px 64px}
        .nav{display:flex;align-items:center;gap:28px;padding:22px 0;border-bottom:1px solid var(--line);margin-bottom:40px}
        .nav a{color:var(--mu);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
        .nav a.on{color:var(--tx);border-color:var(--red)}
        .nav .logo{color:var(--tx);font-size:2rem;font-weight:800;border:0;padding:0}
        .logo b{color:var(--red3)}
        .nav a.btn{color:#fff;padding:0 22px;border:1px solid var(--red)}
        .sp{flex:1}
        h1,.page-title{margin:0;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;font-weight:800;text-transform:uppercase}
        h2,.card-title{margin:0;font-size:1.25rem}
        h3{margin:0;font-size:1.15rem}
        .sub{color:var(--mu);margin:8px 0 28px}
        .card .sub{margin:8px 0 20px}
        .m{color:var(--mu);font-size:.92rem;margin:4px 0 0}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
        .g,.grid-2,.grid-3,.grid-profile{display:grid;gap:24px;align-items:start}
        .c2,.grid-2{grid-template-columns:1fr 1fr}
        .grid-3{grid-template-columns:repeat(3,1fr)}
        .grid-profile{grid-template-columns:1fr 2fr}
        .mt{margin-top:16px}
        .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
        .row>.field{flex:1}
        form{margin:0}
        label{display:block;color:var(--mu);font-size:.9rem;margin-top:16px}
        label input{display:block;width:100%;margin-top:8px}
        .field{margin-top:16px}
        .field label{margin:0 0 8px}
        .field input,.field select,.field textarea{display:block;width:100%}
        input,select,textarea{min-height:48px;padding:0 14px;background:var(--field);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit;color-scheme:dark}
        textarea{padding:12px 14px;min-height:120px}
        input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:1px}
        input[readonly],input:disabled{opacity:.6}
        .btn,.b2{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:8px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--red);background:var(--red);color:#fff}
        .btn:not(.btn-outline):not(.btn-danger-outline):hover{background:var(--red2)}
        .b2,.btn-outline{background:transparent;border-color:var(--line);color:var(--tx);font-weight:500}
        .b2{min-height:38px;padding:0 16px}
        .b2:hover,.btn-outline:hover{border-color:#4a4a50;background:#1d1d20}
        .btn-danger-outline{background:transparent;border-color:var(--red);color:#f87171}
        .btn-danger-outline:hover{background:rgba(220,38,38,.15)}
        .btn:focus-visible,.b2:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
        form.card>.btn{margin-top:24px}
        .card>a.btn{margin-top:4px}
        .acts{display:flex;gap:8px}
        table{width:100%;border-collapse:collapse;margin-top:12px}
        th{color:var(--mu);font-weight:400;font-size:.9rem;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
        td{padding:14px 8px;border-bottom:1px solid var(--line)}
        tr:last-child td{border-bottom:0}
        .wt{color:var(--am)}.ok{color:var(--gr)}.no{color:#f87171}
        .t{border:1px solid;border-radius:999px;padding:0 12px;font-size:.85rem}
        .li{border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}
        .alert{background:rgba(220,38,38,.12);border:1px solid var(--red);color:#fca5a5;padding:12px 14px;border-radius:10px;margin-top:16px}
        .field-error{display:block;color:#f87171;font-size:.85rem;margin-top:6px}
        .hero{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;margin:24px 0 48px}
        .hero h1{font-size:clamp(3rem,8vw,5.6rem)}
        .hero h1 span{display:block;color:var(--red3)}
        .hero p{color:var(--mu);margin:24px 0 0}
        .hero-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
        .feature p,.step p{color:var(--mu);margin:8px 0 16px}
        .step .num{color:var(--red3);font-size:2.6rem;font-weight:800;line-height:1}
        .step h3{margin-top:16px}
        .section-title{margin:48px 0 20px;font-size:1.5rem}
        .avatar{width:72px;height:72px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800}
        .profile-name{margin:14px 0 0;font-size:1.4rem;font-weight:700}
        .profile-meta{margin:4px 0;color:var(--mu)}
        .badge{display:inline-block;margin:12px 0 18px;padding:2px 14px;border:1px solid var(--red);color:#f87171;border-radius:999px;font-size:.85rem}
        .form-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
        @media(max-width:800px){.c2,.grid-2,.grid-3,.grid-profile,.hero{grid-template-columns:1fr}.nav{flex-wrap:wrap;gap:12px 20px}}
    </style>
</head>
<body>
<div class="container">


    <h1 class="page-title">Welcome to RideX</h1>
    <p class="sub">Sign in or create an account to continue.</p>

    <div class="grid-2">
        <form class="card" th:action="@{/users/login}" th:object="${loginDTO}" method="post">
            <h2 class="card-title">Sign in</h2>

            <div class="alert" th:if="${error}" th:text="${error}"></div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" th:field="*{password}">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <button type="submit" class="btn">Sign in</button>
        </form>

        <div class="card">
            <h2 class="card-title">New to RideX?</h2>
            <p class="sub">Create a free account to rent bikes, list your own or share rides.</p>
            <a class="btn btn-outline" th:href="@{/users/register}">Create account</a>
        </div>
    </div>

</div>
</body>
</html>
