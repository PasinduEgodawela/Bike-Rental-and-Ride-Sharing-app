<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Details</title>
    <style>
        :root{--bg:#0e0e10;--card:#161618;--line:#2a2a2d;--field:#0b0b0c;--tx:#f4f4f5;--mu:#9a9aa2;--red:#dc2626;--red2:#b91c1c;--red3:#ff4545}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,sans-serif}
        .container{max-width:800px;margin:40px auto;padding:0 24px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px}
        h2{margin-top:0;font-size:1.75rem;font-weight:800}
        .info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
        .info-row:last-child{border-bottom:0}
        .label{color:var(--mu)}
        .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:8px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--red);background:var(--red);color:#fff;margin-top:24px}
        .btn:hover{background:var(--red2)}
        .form-group{margin-top:20px}
        label{display:block;color:var(--mu);font-size:.9rem;margin-bottom:8px}
        input{display:block;width:100%;min-height:48px;padding:0 14px;background:var(--field);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit;color-scheme:dark}
    
        /* NAVBAR (same look as the other pages) */
        .nav{display:flex;align-items:center;gap:28px;padding:22px 24px;border-bottom:1px solid #2a2a2d;margin-bottom:0;width:100%}
        .nav a{color:#9a9aa2;text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;transition:0.2s;white-space:nowrap}
        .nav a:hover{color:#f4f4f5}
        .nav a.on{color:#f4f4f5;border-color:#dc2626}
        .nav .logo{color:#f4f4f5;font-size:2rem;font-weight:800;border:0;padding:0}
        .logo b{color:#ff4545}
        .nav .profile-btn{margin-left:auto;color:#fff;padding:0 24px;min-height:44px;border:1px solid #dc2626;border-radius:8px;background:#dc2626;display:inline-flex;align-items:center;justify-content:center;font-weight:600;white-space:nowrap}
        .nav .profile-btn:hover{background:#b91c1c;border-color:#b91c1c}
        @media(max-width:800px){.nav{gap:14px;flex-wrap:wrap}}
    </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('payments')}"></div>

<div class="container">
    <div class="card">
        <h2>Booking Billing Details</h2>
        <div th:if="${error}" th:text="${error}" style="background:rgba(220,38,38,.12);border:1px solid #dc2626;color:#fca5a5;padding:12px 14px;border-radius:10px;margin:16px 0"></div>

        <div class="info-row">
            <span class="label">Booking ID:</span>
            <strong th:text="${booking.bookingId}">B001</strong>
        </div>
        <div class="info-row">
            <span class="label">Customer Name:</span>
            <span th:text="${booking.customerName}">John Doe</span>
        </div>
        <div class="info-row">
            <span class="label">Email:</span>
            <span th:text="${booking.email}">john@example.com</span>
        </div>
        <div class="info-row">
            <span class="label">Phone:</span>
            <span th:text="${booking.phone}">0771234567</span>
        </div>
        <div class="info-row">
            <span class="label">Price Per Day:</span>
            <span th:text="'Rs. ' + ${booking.pricePerDay}">Rs. 1500.0</span>
        </div>

        <!-- Form to select dates and calculate -->
        <form th:action="@{/payments/calculate}" method="get">
            <input type="hidden" name="id" th:value="${booking.bookingId}" />

            <div class="form-group">
                <label>Start Date</label>
                <input type="date" name="start" th:value="${booking.suggestedStart}" th:min="${today}" required />
            </div>

            <div class="form-group">
                <label>End Date</label>
                <input type="date" name="end" th:value="${booking.suggestedStart}" th:min="${today}" required />
            </div>

            <button type="submit" class="btn">Calculate Total Cost</button>
        </form>
    </div>
</div>

</body>
</html>
