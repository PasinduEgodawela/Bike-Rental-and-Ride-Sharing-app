<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Payments</title>
    <style>
        :root{--bg:#0e0e10;--card:#161618;--line:#2a2a2d;--tx:#f4f4f5;--mu:#9a9aa2;--red:#dc2626;--red2:#b91c1c;--gr:#34d399}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,sans-serif}
        .container{max-width:1200px;margin:40px auto;padding:0 24px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
        h2{margin-top:0;font-size:1.75rem;font-weight:800}
        table{width:100%;border-collapse:collapse;margin-top:20px}
        th{color:var(--mu);font-weight:400;text-align:left;padding:12px;border-bottom:1px solid var(--line)}
        td{padding:14px 12px;border-bottom:1px solid var(--line);font-size:0.95rem}
        tr:last-child td{border-bottom:0}
        .b2{padding:6px 12px;border-radius:6px;font-size:0.85rem;font-weight:500;text-decoration:none;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--tx)}
        .b2:hover{background:#1d1d20}
        .btn-danger{border-color:var(--red);color:#f87171}
        .btn-danger:hover{background:rgba(220,38,38,.15)}
        select{padding:6px;background:#0b0b0c;color:var(--tx);border:1px solid var(--line);border-radius:6px;}
    
        /* NAVBAR (same look as the other pages) */
        .nav{display:flex;align-items:center;gap:28px;padding:22px 24px;border-bottom:1px solid #2a2a2d;margin-bottom:0;width:100%}
        .nav a{color:#9a9aa2;text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;transition:0.2s;white-space:nowrap}
        .nav a:hover{color:#f4f4f5}
        .nav a.on{color:#f4f4f5;border-color:#dc2626}
        .nav .logo{color:#f4f4f5;font-size:2rem;font-weight:800;border:0;padding:0}
        .logo b{color:#ff4545}
        .nav .profile-btn{margin-left:auto;color:#fff;padding:0 24px;min-height:44px;border:1px solid #dc2626;border-radius:8px;background:#dc2626;display:inline-flex;align-items:center;justify-content:center;font-weight:600;white-space:nowrap}
        .nav .profile-btn:hover{background:#b91c1c;border-color:#b91c1c}
        @media(max-width:800px){.nav{gap:14px;flex-wrap:wrap}}
    </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('payments')}"></div>

<div class="container">
    <div class="card">
        <h2>Payment Records List</h2>
        <div th:if="${error}" th:text="${error}" style="background:rgba(220,38,38,.12);border:1px solid #dc2626;color:#fca5a5;padding:12px 14px;border-radius:10px;margin:16px 0"></div>
        <div th:if="${message}" th:text="${message}" style="background:rgba(52,211,153,.1);border:1px solid #34d399;color:#6ee7b7;padding:12px 14px;border-radius:10px;margin:16px 0"></div>

        <div th:if="${payments.empty}" style="color: var(--mu); padding: 20px 0;">
            No payment records found.
        </div>

        <table th:if="${!payments.empty}">
            <thead>
            <tr>
                <th>Payment ID</th>
                <th>Booking ID</th>
                <th>User ID</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Status</th>
                <th>Date</th>
                <th th:if="${role == 'Admin'}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${payments}">
                <td th:text="${p.paymentId}" style="font-weight: 600;">P001</td>
                <td th:text="${p.bookingId}">B001</td>
                <td th:text="${p.userId}">U001</td>
                <td th:text="'Rs. ' + ${p.amount}">Rs. 5000</td>
                <td th:text="${p.method}">Card</td>
                <td>
                    <!-- only an Admin can change the status -->
                    <form th:if="${role == 'Admin'}" th:action="@{/payments/update}" method="post" style="display:inline;">
                        <input type="hidden" name="paymentId" th:value="${p.paymentId}" />
                        <select name="status" onchange="this.form.submit()">
                            <option value="Paid" th:selected="${p.status == 'Paid'}">Paid</option>
                            <option value="Pending" th:selected="${p.status == 'Pending'}">Pending</option>
                        </select>
                    </form>
                    <span th:unless="${role == 'Admin'}" th:text="${p.status}">Paid</span>
                </td>
                <td th:text="${p.paymentDate}" style="color: var(--mu);">2026-06-06</td>
                <td th:if="${role == 'Admin'}">
                    <form th:action="@{/payments/delete/{id}(id=${p.paymentId})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this payment?');">
                        <button type="submit" class="b2 btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
