
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Edit Booking | RideX</title>

  <style>
    :root {
      --bg: #0e0e10;
      --card: #161618;
      --line: #2a2a2d;
      --field: #0b0b0c;
      --tx: #f4f4f5;
      --mu: #9a9aa2;
      --red: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.5 Arial, sans-serif;
    }

    .pg {
      max-width: 1200px;
      margin: auto;
      padding: 0 24px 60px;
    }

    h1 {
      font-size: 2.8rem;
      text-transform: uppercase;
    }

    h1 span { color: #ff4545; }

    .sub { color: var(--mu); }

    .card {
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
    }

    label {
      display: block;
      color: var(--mu);
      margin-top: 18px;
    }

    input, select {
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      padding: 10px 14px;
      background: var(--field);
      color: var(--tx);
      border: 1px solid var(--line);
      border-radius: 9px;
      font: inherit;
      color-scheme: dark;
    }

    input[readonly] { opacity: .6; }

    .row {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .btn, .b2 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn {
      background: var(--red);
      color: white;
      border: 1px solid var(--red);
    }

    .b2 {
      background: transparent;
      color: white;
      border: 1px solid var(--line);
    }

    @media(max-width:600px) {
      .pg { padding: 0 15px 40px; }
    }
  </style>
</head>

<body>

<div class="pg">

  <div th:replace="~{fragments/layout :: navbar('bookings')}"></div>

  <h1>EDIT <span>BOOKING</span></h1>

  <p class="sub"
     th:text="'Booking ID: ' + ${booking.bookingId}">
    Booking ID: BK001
  </p>

  <div th:if="${error}" th:text="${error}" style="background:rgba(220,38,38,.12);border:1px solid #dc2626;color:#fca5a5;padding:12px 14px;border-radius:10px;margin:16px 0"></div>
  <div class="card">
    <h2>Update Booking Details</h2>

    <form th:action="@{/bookings/update/{bookingId}(bookingId=${booking.bookingId})}"
          method="post">

      <label>
        Bike ID

        <input type="text"
               name="bikeId"
               th:value="${booking.bikeId}" th:title="${booking.bikeName}"
               readonly>
      </label>

      <label>
        Booking Date

        <input type="date"
               name="bookingDate"
               th:value="${booking.bookingDate}"
               required>
      </label>

      <label>
        Status

        <!-- Admin: any status. Customer: keep the current status or cancel. -->
        <select name="status" required th:if="${isAdmin}">
          <option value="Pending"
                  th:selected="${booking.status == 'Pending'}">Pending</option>
          <option value="Confirmed"
                  th:selected="${booking.status == 'Confirmed'}">Confirmed</option>
          <option value="Cancelled"
                  th:selected="${booking.status == 'Cancelled'}">Cancelled</option>
          <option value="Completed"
                  th:selected="${booking.status == 'Completed'}">Completed</option>
        </select>

        <select name="status" required th:unless="${isAdmin}">
          <option th:value="${booking.status}"
                  th:text="${booking.status}"
                  selected>Pending</option>
          <option value="Cancelled"
                  th:if="${booking.status == 'Pending' or booking.status == 'Confirmed'}">Cancel this booking</option>
        </select>
      </label>

      <div class="row">

        <button type="submit" class="btn">
          Save Changes
        </button>

        <a th:href="@{/bookings}" class="b2">
          Cancel
        </a>

      </div>

    </form>

  </div>

</div>

</body>
</html>
