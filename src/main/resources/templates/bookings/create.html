
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>New Booking | RideX</title>

  <style>
    :root {
      --bg: #0e0e10;
      --card: #161618;
      --line: #2a2a2d;
      --field: #0b0b0c;
      --tx: #f4f4f5;
      --mu: #9a9aa2;
      --red: #dc2626;
      --red2: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.5 Arial, sans-serif;
    }

    .pg {
      max-width: 1200px;
      margin: auto;
      padding: 0 24px 60px;
    }

    h1 {
      font-size: 3rem;
      text-transform: uppercase;
    }

    h1 span { color: #ff4545; }

    .sub { color: var(--mu); }

    .card {
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      margin-top: 25px;
    }

    label {
      display: block;
      color: var(--mu);
      margin-top: 18px;
    }

    input, select {
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      padding: 10px 14px;
      background: var(--field);
      color: var(--tx);
      border: 1px solid var(--line);
      border-radius: 9px;
      font: inherit;
      color-scheme: dark;
    }

    input:focus, select:focus {
      outline: 2px solid var(--red);
    }

    .row {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .btn, .b2 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn {
      background: var(--red);
      color: white;
      border: 1px solid var(--red);
    }

    .btn:hover { background: var(--red2); }

    .b2 {
      background: transparent;
      color: white;
      border: 1px solid var(--line);
    }

    .alert {
      color: #fca5a5;
      background: rgba(220,38,38,.12);
      border: 1px solid var(--red);
      padding: 12px;
      border-radius: 9px;
    }

    @media(max-width:600px) {
      .pg { padding: 0 15px 40px; }
    }
  </style>
</head>

<body>

<div class="pg">

  <div th:replace="~{fragments/layout :: navbar('bookings')}"></div>

  <h1>NEW <span>BOOKING</span></h1>

  <p class="sub">
    Complete the details below to request your bike rental.
  </p>

  <div th:if="${error != null}"
       class="alert"
       th:text="${error}">
  </div>

  <div class="card">

    <h2>Booking Details</h2>

    <p class="sub">
      Choose a bike and a booking date.
    </p>

    <form th:action="@{/bookings/save}"
          th:object="${booking}"
          method="post">

      <label>
        Bike

        <select th:field="*{bikeId}" required>
          <option value="">-- Select a bike --</option>
          <option th:each="bike : ${bikes}"
                  th:value="${bike.bikeId}"
                  th:text="${bike.bikeId + ' - ' + bike.model + ' (' + bike.location + ', Rs. ' + bike.pricePerDay + ' / day)'}">
            B001 - Honda (Kandy)
          </option>
        </select>
      </label>

      <label>
        Booking Date

        <input type="date"
               th:field="*{bookingDate}"
               required>
      </label>

      <label>
        Booking Status

        <select th:field="*{status}" required>
          <option value="Pending">Pending</option>
        </select>
      </label>

      <div class="row">

        <button type="submit" class="btn">
          Request Booking
        </button>

        <a th:href="@{/bikes}" class="b2">
          Cancel
        </a>

      </div>

    </form>

  </div>

</div>

</body>
</html>
