
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Bookings | RideX</title>

  <style>
    :root {
      --bg: #0e0e10;
      --card: #161618;
      --line: #2a2a2d;
      --tx: #f4f4f5;
      --mu: #9a9aa2;
      --red: #dc2626;
      --am: #f5b82e;
      --gr: #34d399;
      --red2: #b91c1c;
      --red3: #ff4545;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.5 Arial, sans-serif;
    }

    .pg {
      max-width: 1200px;
      margin: auto;
      padding: 0 24px 60px;
    }

    h1 {
      font-size: 2.8rem;
      text-transform: uppercase;
    }

    h1 span { color: #ff4545; }

    .sub { color: var(--mu); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      margin-top: 25px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 15px 10px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    th { color: var(--mu); }

    .id {
      color: #ff4545;
      font-weight: bold;
    }

    .status {
      border: 1px solid currentColor;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: .8rem;
    }

    .wt { color: var(--am); }
    .ok { color: var(--gr); }
    .no { color: #f87171; }

    .btn, .b2 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 13px;
      border-radius: 7px;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    .btn {
      background: var(--red);
      color: white;
      border: 1px solid var(--red);
    }

    .b2 {
      background: transparent;
      color: white;
      border: 1px solid var(--line);
    }

    .acts {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: var(--mu);
    }

    .footer {
      text-align: center;
      color: var(--mu);
      margin-top: 30px;
    }

    @media(max-width:600px) {
      .pg { padding: 0 14px 40px; }
      .card { padding: 14px; }
    }
  
    /* NAVBAR */
    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 22px 24px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 40px;
      width: 100%;
    }
    .nav a {
      color: var(--mu);
      text-decoration: none;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
      transition: 0.2s;
      white-space: nowrap;
    }
    .nav a:hover { color: var(--tx); }
    .nav a.on {
      color: var(--tx);
      border-color: var(--red);
    }
    .nav .logo {
      color: var(--tx);
      font-size: 2rem;
      font-weight: 800;
      border: 0;
      padding: 0;
    }
    .logo b { color: var(--red3); }
    .nav .profile-btn {
      margin-left: auto;
      color: #fff;
      padding: 0 24px;
      min-height: 44px;
      border: 1px solid var(--red);
      border-radius: 8px;
      background: var(--red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      white-space: nowrap;
    }
    .nav .profile-btn:hover {
      background: var(--red2);
      border-color: var(--red2);
    }
    @media (max-width: 800px) {
      .nav { gap: 14px; flex-wrap: wrap; }
    }
  </style>
</head>

<body>

<div class="pg">

  <div th:replace="~{fragments/layout :: navbar('bookings')}"></div>

  <h1>MY <span>BOOKINGS</span></h1>

  <p class="sub">
    View and manage your bike rental bookings.
  </p>

  <div th:if="${error}" th:text="${error}" style="background:rgba(220,38,38,.12);border:1px solid #dc2626;color:#fca5a5;padding:12px 14px;border-radius:10px;margin:16px 0"></div>
  <div th:if="${message}" th:text="${message}" style="background:rgba(52,211,153,.1);border:1px solid #34d399;color:#6ee7b7;padding:12px 14px;border-radius:10px;margin:16px 0"></div>
  <div style="margin-top:20px">

    <a th:href="@{/bookings/create}" class="btn">
      + New Booking
    </a>

  </div>

  <div class="card">

    <h2>My Booking Records</h2>

    <div class="table-wrap">

      <table>

        <thead>
        <tr>
          <th>Booking ID</th>
          <th>Bike Model</th>
          <th>Booking Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="b : ${bookings}">
          <td th:text="${b.bookingId}"></td>
          <td th:text="${b.bikeName}"></td>
          <td th:text="${b.bookingDate}"></td>
          <td th:text="${b.status}"></td>

          <td>
            <div class="acts">
              <a class="b2" th:href="@{/bookings/edit/{id}(id=${b.bookingId})}">
                Edit
              </a>

              <form th:action="@{/bookings/delete/{id}(id=${b.bookingId})}"
                    method="post"
                    style="display:inline;"
                    onsubmit="return confirm('Delete this booking?');">
                <button class="b2" type="submit">Delete</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(bookings)}">

          <td colspan="5" class="empty">
            You have no bookings yet.
          </td>

        </tr>

        </tbody>

      </table>

    </div>

  </div>

  <div class="footer">
    © 2026 RIDEX | Bike Rental Management System
  </div>

</div>

</body>
</html>
