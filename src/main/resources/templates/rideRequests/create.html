
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Ride Request | RideX</title>

  <style>
    :root {
      --bg: #0e0e10;
      --card: #171719;
      --line: #2c2c30;
      --tx: #f4f4f5;
      --mu: #9999a3;
      --red: #dc2626;
      --red2: #ff4545;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
              radial-gradient(ellipse at top right,
              rgba(220,38,38,.09), transparent 35%),
              var(--bg);
      color: var(--tx);
      font: 16px/1.5 Inter, "Segoe UI", system-ui, Arial, sans-serif;
    }

    .container {
      max-width: 1250px;
      margin: 0 auto;
      padding: 0 26px 70px;
    }

    .form-card {
      max-width: 650px;
      margin: 40px auto;
      padding: 35px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 15px;
    }

    .eyebrow {
      color: var(--red2);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 span {
      color: var(--red2);
    }

    .description {
      color: var(--mu);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: .9rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #101012;
      color: var(--tx);
      font-size: 1rem;
      outline: none;
    }

    input[readonly] {
      color: #c4c4cc;
      cursor: not-allowed;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 13px 22px;
      border: 0;
      border-radius: 8px;
      text-decoration: none;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .submit-btn {
      background: var(--red);
      color: white;
      flex: 1;
    }

    .submit-btn:hover {
      background: #b91c1c;
    }

    .cancel-btn {
      background: #29292e;
      color: white;
    }

    @media(max-width: 600px) {
      .container {
        padding: 0 16px 40px;
      }

      .form-card {
        padding: 22px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- NAVBAR -->
  <div th:replace="~{fragments/layout :: navbar('rideRequests')}"></div>

  <div class="form-card">

    <div class="eyebrow">RideX Management</div>

    <h1>Create <span>Ride Request</span></h1>

    <p class="description">
      Review the booking details and submit your ride request.
    </p>

    <div th:if="${error}" th:text="${error}" style="background:rgba(220,38,38,.12);border:1px solid #dc2626;color:#fca5a5;padding:12px 14px;border-radius:10px;margin:16px 0"></div>
    <form th:action="@{/rideRequests/save}"
          th:object="${rideRequest}"
          method="post">

      <!-- BOOKING ID -->
      <div class="form-group">
        <label for="bookingId">Booking ID</label>

        <input type="text"
               id="bookingId"
               th:field="*{bookingId}"
               readonly
               required>
      </div>

      <!-- PASSENGER ID -->
      <div class="form-group">
        <label for="passengerId">Passenger ID</label>

        <input type="text"
               id="passengerId"
               th:field="*{passengerId}"
               readonly
               required>
      </div>

      <!-- BIKE ID -->
      <div class="form-group">
        <label for="bikeId">Bike ID</label>

        <input type="text"
               id="bikeId"
               th:field="*{bikeId}"
               readonly
               required>
      </div>

      <!-- RIDE: the open ride on this bike that the passenger joins -->
      <div class="form-group">
        <label for="rideId">Ride</label>
        <select id="rideId"
                th:field="*{rideId}"
                th:disabled="${#lists.isEmpty(rides)}"
                style="width:100%;min-height:48px;padding:0 14px;background:#0b0b0c;color:#f4f4f5;border:1px solid #2a2a2d;border-radius:10px;font:inherit">
          <option th:each="ride : ${rides}"
                  th:value="${ride.rideId}"
                  th:text="${ride.rideId + ' - ' + ride.startLocation + ' to ' + ride.destination + ' on ' + ride.rideDate + ' ' + ride.rideTime + ' (' + ride.availableSeats + ' seats left)'}">
            R001
          </option>
        </select>
        <p th:if="${#lists.isEmpty(rides)}"
           style="color:#fca5a5;margin:8px 0 0">
          There is no open ride with a free seat for this bike yet.
        </p>
      </div>

      <div class="buttons">

        <button type="submit" class="btn submit-btn"
                th:disabled="${#lists.isEmpty(rides)}">
          Save Request
        </button>

        <a th:href="@{/bookings}" class="btn cancel-btn">
          Cancel
        </a>

      </div>

    </form>

  </div>

</div>

</body>
</html>
