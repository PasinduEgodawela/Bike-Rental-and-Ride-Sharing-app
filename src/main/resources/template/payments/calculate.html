<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calculate Rental Cost</title>
    <style>
        :root{--bg:#0e0e10;--card:#161618;--line:#2a2a2d;--tx:#f4f4f5;--mu:#9a9aa2;--red:#dc2626;--red2:#b91c1c;--gr:#34d399}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,sans-serif}
        .container{max-width:800px;margin:40px auto;padding:0 24px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px}
        h2{margin-top:0;font-size:1.75rem;font-weight:800}
        .info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
        .label{color:var(--mu)}
        .total-box{background:rgba(52,211,153,.1);border:1px solid var(--gr);color:var(--gr);padding:16px;border-radius:10px;margin:20px 0;font-size:1.2rem;font-weight:bold;text-align:center;}
        .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:8px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--red);background:var(--red);color:#fff;width:100%}
        .btn:hover{background:var(--red2)}
    
        /* NAVBAR (same look as the other pages) */
        .nav{display:flex;align-items:center;gap:28px;padding:22px 24px;border-bottom:1px solid #2a2a2d;margin-bottom:0;width:100%}
        .nav a{color:#9a9aa2;text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;transition:0.2s;white-space:nowrap}
        .nav a:hover{color:#f4f4f5}
        .nav a.on{color:#f4f4f5;border-color:#dc2626}
        .nav .logo{color:#f4f4f5;font-size:2rem;font-weight:800;border:0;padding:0}
        .logo b{color:#ff4545}
        .nav .profile-btn{margin-left:auto;color:#fff;padding:0 24px;min-height:44px;border:1px solid #dc2626;border-radius:8px;background:#dc2626;display:inline-flex;align-items:center;justify-content:center;font-weight:600;white-space:nowrap}
        .nav .profile-btn:hover{background:#b91c1c;border-color:#b91c1c}
        @media(max-width:800px){.nav{gap:14px;flex-wrap:wrap}}
    </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('payments')}"></div>

<div class="container">
    <div class="card">
        <h2>Rental Summary</h2>

        <div class="info-row">
            <span class="label">Customer:</span>
            <span th:text="${booking.customerName}">John</span>
        </div>
        <div class="info-row">
            <span class="label">Rental Period:</span>
            <span th:text="${start} + ' to ' + ${end}">2026-06-01 to 2026-06-05</span>
        </div>
        <div class="info-row">
            <span class="label">Total Days:</span>
            <span th:text="${days} + ' Days'">4 Days</span>
        </div>
        <div class="info-row">
            <span class="label">Price Per Day:</span>
            <span th:text="'Rs. ' + ${pricePerDay}">Rs. 1500.0</span>
        </div>

        <div class="total-box">
            Total Amount: Rs. <span th:text="${total}">6000.0</span>
        </div>

        <form th:action="@{/payments/pay}" method="get">
            <input type="hidden" name="bookingId" th:value="${booking.bookingId}" />
            <input type="hidden" name="start" th:value="${start}" />
            <input type="hidden" name="end" th:value="${end}" />

            <button type="submit" class="btn">Proceed to Payment Options</button>
        </form>
    </div>
</div>

</body>
</html>
