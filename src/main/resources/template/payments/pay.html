<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Make Payment</title>
    <style>
        :root{--bg:#0e0e10;--card:#161618;--line:#2a2a2d;--field:#0b0b0c;--tx:#f4f4f5;--mu:#9a9aa2;--red:#dc2626;--red2:#b91c1c}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,sans-serif}
        .container{max-width:800px;margin:40px auto;padding:0 24px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px}
        h2{margin-top:0;font-size:1.75rem;font-weight:800}
        label{display:block;color:var(--mu);font-size:.9rem;margin-top:16px;margin-bottom:8px}
        input,select{display:block;width:100%;min-height:48px;padding:0 14px;background:var(--field);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit;color-scheme:dark}
        .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:8px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--red);background:var(--red);color:#fff;width:100%;margin-top:24px}
        .btn:hover{background:var(--red2)}
        #card-fields{display:none;border-left:2px solid var(--red);padding-left:16px;margin-top:16px;}
    
        /* NAVBAR (same look as the other pages) */
        .nav{display:flex;align-items:center;gap:28px;padding:22px 24px;border-bottom:1px solid #2a2a2d;margin-bottom:0;width:100%}
        .nav a{color:#9a9aa2;text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;transition:0.2s;white-space:nowrap}
        .nav a:hover{color:#f4f4f5}
        .nav a.on{color:#f4f4f5;border-color:#dc2626}
        .nav .logo{color:#f4f4f5;font-size:2rem;font-weight:800;border:0;padding:0}
        .logo b{color:#ff4545}
        .nav .profile-btn{margin-left:auto;color:#fff;padding:0 24px;min-height:44px;border:1px solid #dc2626;border-radius:8px;background:#dc2626;display:inline-flex;align-items:center;justify-content:center;font-weight:600;white-space:nowrap}
        .nav .profile-btn:hover{background:#b91c1c;border-color:#b91c1c}
        @media(max-width:800px){.nav{gap:14px;flex-wrap:wrap}}
    </style>
    <script>
        function toggleCardFields() {
            var method = document.getElementById("method").value;
            var cardFields = document.getElementById("card-fields");
            if (method === "card") {
                cardFields.style.display = "block";
            } else {
                cardFields.style.display = "none";
            }
        }
    </script>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('payments')}"></div>

<div class="container">
    <div class="card">
        <h2>Complete Payment</h2>
        <div th:if="${error}" th:text="${error}" style="background:rgba(220,38,38,.12);border:1px solid #dc2626;color:#fca5a5;padding:12px 14px;border-radius:10px;margin:16px 0"></div>

        <form th:action="@{/payments/pay}" method="post">
            <input type="hidden" name="bookingId" th:value="${bookingId}" />
            <input type="hidden" name="start" th:value="${start}" />
            <input type="hidden" name="end" th:value="${end}" />

            <label>Payment Method</label>
            <select name="method" id="method" onchange="toggleCardFields()" required>
                <option value="">-- Select Method --</option>
                <option value="cash">Cash</option>
                <option value="online">Online Transfer</option>
                <option value="card">Credit / Debit Card</option>
            </select>

            <!-- Conditional Card Fields -->
            <div id="card-fields">
                <label>Cardholder Name</label>
                <input type="text" name="cardName" placeholder="John Doe" />

                <label>Card Number (16 digits)</label>
                <input type="text" name="cardNumber" maxlength="16" placeholder="4111222233334444" />

                <label>Expiry Date (MM/YY)</label>
                <input type="text" name="expiry" placeholder="12/28" />

                <label>CVV</label>
                <input type="password" name="cvv" maxlength="4" placeholder="123" />
            </div>

            <button type="submit" class="btn">Pay Now</button>
        </form>
    </div>
</div>

</body>
</html>
